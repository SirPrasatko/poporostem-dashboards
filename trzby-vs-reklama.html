<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poporostem — Tržby vs Reklama</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f0; color: #333; padding: 20px; max-width: 1200px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #009901; font-size: 24px; }
.header p { color: #888; font-size: 13px; margin-top: 4px; }
.chart-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
.chart-wrap canvas { max-height: 450px; }
.kpi-row { display: flex; gap: 16px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.kpi { background: white; padding: 14px 24px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.kpi .value { font-size: 22px; font-weight: 700; }
.kpi .label { font-size: 12px; color: #888; margin-top: 2px; }
.pno-chart { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-top: 20px; }
.pno-chart canvas { max-height: 250px; }
.nav { display: flex; gap: 10px; justify-content: center; margin-top: 20px; font-size: 14px; }
.nav a { color: #643403; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
</style>
</head>
<body>

<div class="header">
    <h1>Tržby vs Reklamní výdaje — B2C bez DPH</h1>
    <p>Leden 2025 – Březen 2026 · Meta Ads + Google Ads + Sklik + Heureka</p>
</div>

<div class="kpi-row">
    <div class="kpi"><div class="value" style="color:#009901">8,852,701 Kč</div><div class="label">Celkové tržby</div></div>
    <div class="kpi"><div class="value" style="color:#c0392b">1,005,398 Kč</div><div class="label">Celkové výdaje za reklamu</div></div>
    <div class="kpi"><div class="value" style="color:#643403">11.4 %</div><div class="label">Průměrné PNO</div></div>
    <div class="kpi"><div class="value" style="color:#643403">8.8×</div><div class="label">ROAS</div></div>
</div>

<div class="chart-wrap">
    <canvas id="mainChart"></canvas>
</div>

<div class="pno-chart">
    <canvas id="pnoChart"></canvas>
</div>

<div class="nav">
    <a href="leden.html">Leden</a>
    <a href="unor.html">Únor</a>
    <a href="brezen.html">Březen</a>
    <a href="analytika.html">Analytika</a>
    <a href="trzby-vs-reklama.html" style="font-weight:700;color:#009901;">Tržby vs Reklama</a><a href="trzby-vs-naklady.html" style="color:#643403;text-decoration:none;padding:8px 16px;border-radius:8px;background:white;box-shadow:0 1px 4px rgba(0,0,0,0.08);">Tržby vs Náklady</a><a href="marketingove-pno.html" style="color:#643403;text-decoration:none;padding:8px 16px;border-radius:8px;background:white;box-shadow:0 1px 4px rgba(0,0,0,0.08);">Marketingové PNO</a>
</div>

<script>
const labels = ["Led 25", "\u00dano 25", "B\u0159e 25", "Dub 25", "Kv\u011b 25", "\u010cvn 25", "\u010cvc 25", "Srp 25", "Z\u00e1\u0159 25", "\u0158\u00edj 25", "Lis 25", "Pro 25", "Led 26", "\u00dano 26", "B\u0159e 26"];
const rev = [173428.0, 384718.0, 760416.0, 848309.0, 951992.0, 775573.0, 623319.0, 443912.0, 387232.0, 330867.0, 542029.0, 680629.0, 376124.0, 608948.0, 965205.0];
const adsTotal = [12297, 39715, 58506, 80775, 84474, 87304, 60618, 50028, 48813, 52366, 50318, 82550, 70403, 110867, 116364];
const adsMeta = [8228, 33371, 42958, 65772, 65782, 71987, 47590, 42002, 45245, 32487, 19711, 33342, 33627, 45558, 59281];
const adsGoogle = [3008, 4579, 11104, 11052, 14087, 10146, 9963, 4054, 1398, 16937, 28450, 47914, 34534, 62609, 54146];
const adsSklik = [865, 1560, 3993, 3407, 3752, 3826, 2453, 2837, 1874, 2524, 1351, 714, 1775, 2263, 2342];
const adsHeureka = [197, 205, 451, 544, 853, 1346, 612, 1135, 295, 418, 805, 579, 467, 437, 597];
const pno = [7.1, 10.3, 7.7, 9.5, 8.9, 11.3, 9.7, 11.3, 12.6, 15.8, 9.3, 12.1, 18.7, 18.2, 12.1];

const fmt = v => v.toLocaleString('cs-CZ') + ' Kč';

// Main chart: bars = revenue, line = ad spend
new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [
            {
                label: 'Tržby B2C',
                data: rev,
                backgroundColor: rev.map((v, i) => i >= 12 ? 'rgba(0,153,1,0.7)' : 'rgba(0,153,1,0.45)'),
                borderRadius: 3,
                order: 2,
                yAxisID: 'y',
            },
            {
                label: 'Reklama celkem',
                data: adsTotal,
                type: 'line',
                borderColor: '#c0392b',
                backgroundColor: 'rgba(192,57,43,0.1)',
                borderWidth: 2.5,
                pointRadius: 4,
                pointBackgroundColor: '#c0392b',
                fill: true,
                order: 1,
                yAxisID: 'y2',
            },
        ]
    },
    options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
            tooltip: {
                callbacks: {
                    label: (ctx) => {
                        if (ctx.datasetIndex === 0) return 'Tržby: ' + fmt(ctx.raw);
                        return 'Reklama: ' + fmt(ctx.raw);
                    },
                    afterBody: (items) => {
                        const i = items[0].dataIndex;
                        return '\nMeta: ' + fmt(adsMeta[i]) + 
                               '\nGoogle: ' + fmt(adsGoogle[i]) + 
                               '\nSklik: ' + fmt(adsSklik[i]) + 
                               '\nHeureka: ' + fmt(adsHeureka[i]) +
                               '\nPNO: ' + pno[i] + '%';
                    }
                }
            },
            legend: { position: 'bottom' },
        },
        scales: {
            y: {
                position: 'left',
                ticks: { callback: v => (v / 1000) + 'K' },
                grid: { color: 'rgba(0,0,0,0.06)' },
                title: { display: true, text: 'Tržby (Kč bez DPH)', color: '#009901' },
            },
            y2: {
                position: 'right',
                ticks: { callback: v => (v / 1000) + 'K', color: '#c0392b' },
                grid: { display: false },
                title: { display: true, text: 'Reklama (Kč)', color: '#c0392b' },
            },
            x: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
    }
});

// PNO chart
new Chart(document.getElementById('pnoChart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'PNO (%)',
            data: pno,
            borderColor: '#f8a102',
            backgroundColor: 'rgba(248,161,2,0.1)',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: pno.map(v => v > 15 ? '#c0392b' : '#009901'),
            fill: true,
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => 'PNO: ' + ctx.raw + '%' } },
        },
        scales: {
            y: { 
                ticks: { callback: v => v + '%' },
                grid: { color: 'rgba(0,0,0,0.06)' },
                title: { display: true, text: 'PNO (podíl nákladů na obratu)' },
            },
            x: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
    }
});
</script>
</body>
</html>
